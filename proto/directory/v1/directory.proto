syntax = "proto3";

package directory.v1;

option go_package = "authority-app/backend/proto/directory/v1;directorypb";

// ディレクトリサービス
service DirectoryService {
  // ディレクトリ作成
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  // ディレクトリ共有（権限付与）
  rpc ShareDirectory(ShareDirectoryRequest) returns (ShareDirectoryResponse);
  // 権限チェック
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // 子ディレクトリ一覧取得
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
}

// --- Messages ---

message User {
  string id = 1;
}

message Directory {
  string id = 1;
  string name = 2;
  string parent_id = 3; // 親ディレクトリID
}

// Create
message CreateDirectoryRequest {
  string name = 1;
  string parent_id = 2; // ルートの場合は空
  User creator = 3;
}
message CreateDirectoryResponse {
  Directory directory = 1;
}

// Share
message ShareDirectoryRequest {
  User user = 1; // 権限を付与されるユーザー
  string relation = 2; // "owner", "editor", "viewer"
  string directory_id = 3;
  User granter = 4; // 権限を与えるユーザー
}
message ShareDirectoryResponse {
  bool success = 1;
}

// Check
message CheckPermissionRequest {
  User user = 1;
  string relation = 2; // "can_view", "can_edit" など
  string directory_id = 3;
}
message CheckPermissionResponse {
  bool allowed = 1;
}

// List
message ListChildrenRequest {
  string directory_id = 1;
  User user = 2;
}
message ListChildrenResponse {
  repeated Directory directories = 1;
}
